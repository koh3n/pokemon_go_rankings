# Build the website (web/) and publish it with GitHub Pages.
#
# Runs when main changes, after every "Refresh data" run (the refresh job pushes with the default
# token, and pushes made that way don't trigger other workflows, so this listens for it finishing
# instead), and on demand.
#
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# The site is public even though the repository is private.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # a failed refresh has nothing new to publish
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main      # after a refresh, the newest data commit

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
